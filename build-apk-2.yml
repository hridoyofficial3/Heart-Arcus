name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

env:
  OBFUSCATE: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Decide where releases are published
        env:
          RELEASES_REPO: ${{ secrets.RELEASES_REPO }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -n "$RELEASES_REPO" ] && [ -n "$RELEASES_TOKEN" ]; then
            echo "RELEASE_REPO=$RELEASES_REPO" >> $GITHUB_ENV
            echo "USE_SEPARATE=1" >> $GITHUB_ENV
          else
            echo "RELEASE_REPO=${{ github.repository }}" >> $GITHUB_ENV
            echo "USE_SEPARATE=0" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: npm install

      - name: Copy web files to www
        run: |
          mkdir -p www
          cp -r backgrounds *.js *.css *.html *.json *.png www/
          rm -f www/package.json www/capacitor.config.json
          echo "window.APP_BUILD={build:${{ github.run_number }},repo:\"$RELEASE_REPO\"};" > www/app-version.js

      - name: Obfuscate JavaScript
        if: env.OBFUSCATE == 'true'
        run: node tools/obfuscate.js

      - name: Add Android platform
        run: npx cap add android

      - name: Patch MainActivity for Google login
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "Patching $F"
          PKG=$(grep -m1 '^package ' "$F" | sed 's/package \(.*\);/\1/')
          cat > "$F" <<JAVA
          package $PKG;

          import android.content.Intent;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;
          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {

            @Override
            public void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                PluginHandle pluginHandle = getBridge().getPlugin("SocialLogin");
                if (pluginHandle == null) {
                  Log.i("Google Activity Result", "SocialLogin login handle is null");
                  return;
                }
                Plugin plugin = pluginHandle.getInstance();
                if (!(plugin instanceof SocialLoginPlugin)) {
                  Log.i("Google Activity Result", "SocialLogin plugin instance is not SocialLoginPlugin");
                  return;
                }
                ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
              }
            }

            @Override
            public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          JAVA
          grep -q ModifiedMainActivityForSocialLoginPlugin "$F"

      - name: Set app icon and splash
        run: |
          pip install pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          res = 'android/app/src/main/res'
          bg = (248, 250, 252, 255)
          icon = Image.open('icon-512.png').convert('RGBA')
          mask = Image.open('icon-maskable-512.png').convert('RGBA')
          sizes = {'mdpi': (48, 108), 'hdpi': (72, 162), 'xhdpi': (96, 216), 'xxhdpi': (144, 324), 'xxxhdpi': (192, 432)}
          for d, (legacy, fg) in sizes.items():
              folder = res + '/mipmap-' + d
              os.makedirs(folder, exist_ok=True)
              l = icon.resize((legacy, legacy), Image.LANCZOS)
              l.save(folder + '/ic_launcher.png')
              l.save(folder + '/ic_launcher_round.png')
              canvas = Image.new('RGBA', (fg, fg), (0, 0, 0, 0))
              s = int(fg * 0.78)
              m = mask.resize((s, s), Image.LANCZOS)
              canvas.paste(m, ((fg - s) // 2, (fg - s) // 2), m)
              canvas.save(folder + '/ic_launcher_foreground.png')
          for f in glob.glob(res + '/drawable*/ic_launcher_foreground.xml') + glob.glob(res + '/drawable*/ic_launcher_background.xml'):
              os.remove(f)
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#F8FAFC</color>\n</resources>\n')
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          adaptive = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for n in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(res + '/mipmap-anydpi-v26/' + n, 'w').write(adaptive)
          for p in glob.glob(res + '/drawable*/splash.png'):
              w, h = Image.open(p).size
              c = Image.new('RGBA', (w, h), bg)
              s = int(min(w, h) * 0.3)
              m = mask.resize((s, s), Image.LANCZOS)
              c.paste(m, ((w - s) // 2, (h - s) // 2), m)
              c.convert('RGB').save(p)
          PY

      - name: Add notification permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          grep -q RECEIVE_BOOT_COMPLETED $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>#' $M

      - name: Sync
        run: npx cap sync android

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          block = """android {
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }"""
          s2 = re.sub(r'^android \{', lambda m: block, s, count=1, flags=re.M)
          assert s2 != s, 'android block not found in build.gradle'
          open(p, 'w', encoding='utf-8').write(s2)
          PY
          grep -n "signingConfigs" -A8 android/app/build.gradle | head -14

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Print signing SHA-1 of the built APK
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          echo "== APK signing certificate =="
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1" | tee sha.txt
          echo "== debug.keystore SHA-1 (expected) =="
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep "SHA1" | tee -a sha.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat sha.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arcus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$USE_SEPARATE" = "1" ]; then export GH_TOKEN="$RELEASES_TOKEN"; else export GH_TOKEN="$DEFAULT_TOKEN"; fi
          TAG="build-${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk Arcus.apk
          gh release delete "$TAG" --repo "$RELEASE_REPO" --cleanup-tag -y || true
          gh release create "$TAG" Arcus.apk \
            --repo "$RELEASE_REPO" \
            --title "Arcus (build ${{ github.run_number }})" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
